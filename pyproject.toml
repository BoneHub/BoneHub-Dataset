[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bonehub-dataset"
version = "0.2.0"
description = "A Python package for generating the BoneHub Dataset, including data schema, dataset conversion, segmentation tools, and more."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Hamid Alavi"}
]

# The base install carries the data schema only: `bonehub_data_schema` needs nothing but
# pydantic, so downstream projects that merely read or write BoneHub metadata (such as
# the quality-check server) can depend on this package without pulling in torch, monai,
# ITK and the rest of the conversion stack. Reading and writing the segmentation files
# themselves needs the small `io` extra; everything heavier lives in the extras below.
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Reading and writing BoneHub segmentation files (.seg.nrrd) with
# bonehub_data_schema.write_segmentation / read_segmentation_labels.
io = [
    "numpy",
    "SimpleITK",
]
# Converting third-party datasets into BoneHub data structure format.
converter = [
    "numpy==1.26.4",
    "pydicom==2.4.4",
    "pydicom-seg==0.4.1",
    "monai",
    "nibabel",
    "itk",
    "SimpleITK",
    "pandas",
    "openpyxl",
    "tqdm",
]
# Running the segmentation models.
segmentation = [
    "numpy==1.26.4",
    "monai",
    "torch",
    "torchvision",
    "nibabel",
    "pyyaml",
]
all = [
    "bonehub-dataset[converter,segmentation]",
]

[tool.setuptools.packages.find]
include = [
    "bonehub_data_schema*",
    "bonehub_dataset_converter*",
    "bonehub_segmentation*",
]
